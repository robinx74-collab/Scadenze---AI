<!doctype html>
<html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1457d9"><meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Scadenze AI"><link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest"><link rel="stylesheet" href="styles.css?v=2"><title>Scadenze AI</title></head>
<body><header><div><h1>Scadenze AI</h1><small id="month"></small></div><button id="help">↗</button></header>
<section class="switch"><label>Conto visualizzato</label><select id="accountFilter"></select></section>
<main id="view"></main>
<nav><button data-tab="home" class="active">⌂<span>Home</span></button><button data-tab="expenses">−<span>Spese</span></button>
<button data-tab="incomes">＋<span>Entrate</span></button><button data-tab="deadlines">◷<span>Scadenze</span></button>
<button data-tab="more">•••<span>Altro</span></button></nav>
<dialog id="modal"><form method="dialog" id="form"><div class="mhead"><h2 id="mtitle"></h2><button value="cancel">✕</button></div>
<div id="mbody"></div><div class="actions"><button value="cancel" class="secondary">Annulla</button><button value="default">Salva</button></div></form></dialog>
<input id="importFile" type="file" accept=".json,application/json" hidden><dialog id="sync-panel">
<div class="mhead"><h2>Sincronizzazione iPhone e Mac</h2><button id="sync-close" aria-label="Chiudi">×</button></div>
<p>Usa lo stesso progetto e lo stesso account Supabase su entrambi i dispositivi. La sincronizzazione salva online conti, saldi, movimenti, scadenze e le descrizioni e note che hai inserito.</p>
<form id="sync-login">
<div class="field"><label>Project URL<input name="project" type="url" required placeholder="https://…supabase.co"></label></div>
<div class="field"><label>Chiave pubblicabile<input name="publishable" required placeholder="sb_publishable_…"></label></div>
<div class="field"><label>Email<input name="email" type="email" required autocomplete="username"></label></div>
<div class="field"><label>Password<input name="password" type="password" required autocomplete="current-password"></label></div>
<button class="primary">Accedi e sincronizza</button>
</form>
<div id="sync-controls" class="actions" hidden><button id="sync-now">Sincronizza ora</button><button id="sync-logout">Disconnetti</button></div>
<p id="sync-status" role="status" aria-live="polite">Sincronizzazione da configurare.</p>
<div id="sync-conflict" hidden><button id="sync-local">Conserva modifiche di questo dispositivo</button> <button id="sync-remote">Conserva modifiche online</button></div>
</dialog>
<script src="app.js?v=2"></script><script src="sync.js?v=1"></script></body></html>
